name: Build e Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build — ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            python-arch: x64
            tauri-target: x86_64-pc-windows-msvc
            backend-suffix: x86_64-pc-windows-msvc
            backend-ext: .exe

          - platform: macos-intel
            os: macos-13
            python-arch: x64
            tauri-target: x86_64-apple-darwin
            backend-suffix: x86_64-apple-darwin
            backend-ext: ""

          - platform: macos-arm
            os: macos-latest
            python-arch: arm64
            tauri-target: aarch64-apple-darwin
            backend-suffix: aarch64-apple-darwin
            backend-ext: ""

          - platform: linux
            os: ubuntu-22.04
            python-arch: x64
            tauri-target: x86_64-unknown-linux-gnu
            backend-suffix: x86_64-unknown-linux-gnu
            backend-ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Dependências do sistema (Linux) ──────────────────────────────────
      - name: Instalar dependências do sistema (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config

      # ── Python ───────────────────────────────────────────────────────────
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python-arch }}

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      # ── Build backend Python ─────────────────────────────────────────────
      - name: Build backend Python (Unix)
        if: matrix.platform != 'windows'
        run: |
          mkdir -p src-tauri/binaries
          pyinstaller \
            --onefile \
            --name "holeritech-backend-${{ matrix.backend-suffix }}" \
            --distpath src-tauri/binaries \
            --workpath build/pyinstaller-work \
            --specpath build \
            --hidden-import pdfplumber \
            --hidden-import pytesseract \
            --hidden-import pdf2image \
            --hidden-import PIL \
            --hidden-import loguru \
            --hidden-import requests \
            --hidden-import packaging \
            --hidden-import pypdf \
            --noconfirm \
            backend/main.py

      - name: Build backend Python (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          pyinstaller `
            --onefile `
            --name "holeritech-backend-${{ matrix.backend-suffix }}" `
            --distpath src-tauri/binaries `
            --workpath build/pyinstaller-work `
            --specpath build `
            --hidden-import pdfplumber `
            --hidden-import pytesseract `
            --hidden-import pdf2image `
            --hidden-import PIL `
            --hidden-import loguru `
            --hidden-import requests `
            --hidden-import packaging `
            --hidden-import pypdf `
            --noconfirm `
            backend/main.py

      # ── Node / Tauri ─────────────────────────────────────────────────────
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências Node
        run: npm install

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.tauri-target }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "HoleriTech ${{ github.ref_name }}"
          releaseBody: |
            ## HoleriTech ${{ github.ref_name }}

            ### Instalação
            - **Windows**: Baixe o arquivo `.msi` ou `.exe` (NSIS)
            - **macOS**: Baixe o arquivo `.dmg`
            - **Linux**: Baixe o arquivo `.deb` ou `.AppImage`

            Consulte o [README](https://github.com/${{ github.repository }}/blob/main/README.md) para instruções detalhadas.
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.tauri-target }}
